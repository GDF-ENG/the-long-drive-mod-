<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TLD Mod Installer</title>
  <link rel="icon" href="/static/tld.ico">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<script type="application/json" id="flask-data">
{
  "version": {{ version | tojson }},
  "translations": {{ translations | tojson }}
}
</script>

<script>
(function(){
  function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
  loadScript('/static/js/vue.global.prod.js').catch(function(){return loadScript('https://unpkg.com/vue@3/dist/vue.global.prod.js')}).then(function(){initVueApp()}).catch(function(){document.getElementById('app').innerHTML='<div class="vue-loading"><p>Vue.js 加载失败，请刷新重试。</p></div>'})
})();
</script>

{% raw %}

<div id="app" :class="{ 'sidebar-collapsed': sidebarCollapsed }">

  <!-- 移动端菜单按钮 -->
  <button class="mobile-menu-btn" @click="mobileMenuOpen = !mobileMenuOpen">☰</button>
  <div class="mobile-overlay" :class="{ active: mobileMenuOpen }" @click="mobileMenuOpen = false"></div>

  <div class="vue-loading" v-if="!appReady">{{ t('loading') }}</div>

  <template v-else>

  <!-- ==================== 侧边栏 ==================== -->
  <aside class="sidebar" :class="{ collapsed: sidebarCollapsed, 'mobile-open': mobileMenuOpen }">
    <div class="sidebar-header">
      <span class="logo-icon">🚗</span>
      <span class="logo-text" v-show="!sidebarCollapsed || mobileMenuOpen">{{ t('app_title') }}</span>
    </div>
    <ul class="nav-list">
      <li class="nav-item" :class="{ active: homeSection === 'mods' }" @click="switchHomeSection('mods')">
        <svg viewBox="0 0 24 24"><path d="M4 4h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4zM4 10h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4zM4 16h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4z"/></svg>
        <span class="menu-text">{{ t('home_mods_title') }}</span>
      </li>
      <li class="nav-item" :class="{ active: homeSection === 'workshop' }" @click="switchHomeSection('workshop')">
        <svg viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>
        <span class="menu-text">{{ t('workshop_tool') }}</span>
      </li>
      <li class="nav-item" :class="{ active: homeSection === 'modpacks' }" @click="switchHomeSection('modpacks')">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9h-4v4h-2v-4H9v-2h4V5h2v4h4v2z"/></svg>
        <span class="menu-text">{{ t('modpacks') }}</span>
      </li>
      <li class="nav-item" :class="{ active: homeSection === 'player_modpacks' }" @click="switchHomeSection('player_modpacks')">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
        <span class="menu-text">{{ t('player_modpacks') }}</span>
      </li>
      <li class="nav-item" :class="{ active: homeSection === 'ai' }" @click="switchHomeSection('ai')">
        <svg viewBox="0 0 24 24"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg>
        <span class="menu-text">{{ t('ai_recommend') }}</span>
      </li>
      <li class="nav-item" :class="{ active: homeSection === 'forum' }" @click="switchHomeSection('forum')">
        <svg viewBox="0 0 24 24"><path d="M21 6h-2v9H6v2c0 .55.45 1 1 1h11l4 4V7c0-.55-.45-1-1-1zm-4 6V3c0-.55-.45-1-1-1H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1z"/></svg>
        <span class="menu-text">{{ t('forum') }}</span>
      </li>
      <li class="nav-item" :class="{ active: homeSection === 'installed' }" @click="switchHomeSection('installed')">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.6 3.6 0 0112 15.6z"/></svg>
        <span class="menu-text">{{ t('installed_mods') }}</span>
      </li>
      <li class="nav-item" :class="{ active: homeSection === 'intel' }" @click="switchHomeSection('intel')">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        <span class="menu-text">{{ t('intel_section') }}</span>
      </li>
    </ul>
    <div class="sidebar-footer">
      <button class="sidebar-toggle" @click="sidebarCollapsed = !sidebarCollapsed">{{ sidebarCollapsed ? '▶' : '◀' }}</button>
    </div>
  </aside>

  <!-- 右下角浮动按钮：仅保留设置与公告 -->
  <div class="fab-stack">
    <button class="fab" @click="openAnnouncement" :title="t('announcement_title')">
      <svg viewBox="0 0 24 24"><path d="M18 11v2h4v-2h-4zm-2 6.61c.96.71 2.21 1.65 3.2 2.39.4-.53.8-1.07 1.2-1.6-.99-.74-2.24-1.68-3.2-2.4-.4.54-.8 1.08-1.2 1.61zM20.4 5.6c-.4-.53-.8-1.07-1.2-1.6-.99.74-2.24 1.68-3.2 2.4.4.53.8 1.07 1.2 1.6.96-.72 2.21-1.65 3.2-2.4zM4 9c-1.1 0-2 .9-2 2v2c0 1.1.9 2 2 2h1v4h2v-4h1l5 3V6L8 9H4zm11.5 3c0-1.33-.58-2.53-1.5-3.35v6.69c.92-.81 1.5-2.01 1.5-3.34z"/></svg>
      <span class="fab-notice" v-if="hasAnnouncement">{{ announcementBadge }}</span>
    </button>
    <button class="fab fab-settings" @click="goSettings" :title="t('settings')">
      <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.6 3.6 0 0112 15.6z"/></svg>
    </button>
  </div>

  <!-- ==================== 主内容 ==================== -->
  <main class="main-content" ref="mainContent" @scroll="handleScroll">
    <div class="container">

      <!-- ===== 顶栏：登录 / 注册 ===== -->
      <div class="app-topbar">
        <div class="topbar-left">
          <span class="topbar-title">{{ t('app_title') }}</span>
        </div>
        <div class="topbar-right">
          <div v-if="!currentUser" class="topbar-auth">
            <button class="action-btn primary" @click="showLoginModal = true">{{ t('login') }}</button>
            <button class="action-btn secondary" @click="showRegisterModal = true">{{ t('register') }}</button>
          </div>
          <div v-else class="topbar-user">
            <span class="username">{{ currentUser.username }}</span>
            <button class="action-btn secondary" @click="logout">{{ t('logout') }}</button>
          </div>
        </div>
      </div>

      <!-- ===== 首页 ===== -->
      <div class="tab-content" :class="{ active: activeTab === 'home' }">
        <div class="home-hero">
          <h1 class="home-title">{{ t('home_title') }}</h1>
          <p class="home-subtitle">{{ t('home_subtitle') }}</p>
          <div class="home-badge-row">
            <span class="home-badge accent">{{ t('badge_version', {ver: version}) }}</span>
            <span class="home-badge">{{ t('badge_mods', {n: mods.length}) }}</span>
            <span class="home-badge">{{ t('badge_non_official') }}</span>
          </div>
          <div class="modloader-notice">
            <span class="modloader-icon">⚠️</span>
            <span class="modloader-text">{{ t('modloader_required') }}</span>
          </div>
          <div class="modloader-notice sys-notice">
            <span class="modloader-icon">💻</span>
            <span class="modloader-text">{{ t('sys_requirement') }}</span>
          </div>
          <a class="site-entry" href="https://ksny2025.gitlab.io/TLDTool/" target="_blank" rel="noopener">
            <span class="site-entry-label">{{ t('website') }}</span>
            <span class="site-entry-hint">{{ t('website_hint') }}</span>
            <span class="site-entry-arrow">→</span>
          </a>
        </div>

        <div class="home-search-wrap">
          <span class="home-search-icon">🔍</span>
          <input type="text" class="home-search" v-model="homeSearchQuery"
                 :placeholder="t('home_search_placeholder')" @keyup.enter="doHomeSearch()">
          <button class="home-search-btn" @click="doHomeSearch()">{{ t('search') }}</button>
        </div>

        <div class="search-type-row">
          <button class="search-type-btn" :class="{ active: homeSearchType === 'mods' }" @click="homeSearchType = 'mods'">{{ t('search_type_mods') }}</button>
          <button class="search-type-btn" :class="{ active: homeSearchType === 'modpacks' }" @click="homeSearchType = 'modpacks'">{{ t('search_type_modpacks') }}</button>
          <button class="search-type-btn" :class="{ active: homeSearchType === 'installed' }" @click="homeSearchType = 'installed'">{{ t('search_type_installed') }}</button>
          <button class="search-type-btn" :class="{ active: homeSearchType === 'all' }" @click="homeSearchType = 'all'">{{ t('search_type_all') }}</button>
        </div>

        <h2 class="home-section-title">{{ t('intel_section') }}</h2>
        <button class="intel-add-btn" @click="showIntelEditor = !showIntelEditor">
          <span v-if="!showIntelEditor">+ {{ t('intel_publish') }}</span>
          <span v-else>{{ t('cancel') }}</span>
        </button>

        <!-- 玩家自定义情报发布 -->
        <div class="intel-editor" v-if="showIntelEditor">
          <input type="text" v-model="intelForm.title" :placeholder="t('intel_title_ph')">
          <textarea v-model="intelForm.content" :placeholder="t('intel_content_ph')" rows="3"></textarea>
          <input type="text" v-model="intelForm.link" :placeholder="t('intel_link_ph')">
          <button class="action-btn primary" @click="addIntel">{{ t('intel_submit') }}</button>
        </div>

        <!-- 玩家发布的自定义情报 -->
        <div class="intel-custom-list" v-if="customIntel.length > 0">
          <div class="intel-custom-card" v-for="(item, i) in customIntel" :key="i">
            <div class="intel-custom-title">{{ item.title }}</div>
            <div class="intel-custom-content">{{ item.content }}</div>
            <a v-if="item.link" :href="item.link" target="_blank" rel="noopener" class="intel-custom-link">{{ item.link }}</a>
            <button class="intel-del-btn" @click="removeIntel(i)">&times;</button>
          </div>
        </div>

        <div class="intel-grid">
          <div class="intel-card">
            <div class="intel-label">{{ t('intel_installed') }}</div>
            <div class="intel-value">{{ installedMods.length }}</div>
            <div class="intel-hint">{{ t('intel_installed_hint') }}</div>
          </div>
          <div class="intel-card">
            <div class="intel-label">{{ t('intel_available') }}</div>
            <div class="intel-value">{{ mods.length }}</div>
            <div class="intel-hint">{{ t('intel_available_hint') }}</div>
          </div>
          <div class="intel-card">
            <div class="intel-label">{{ t('intel_modpacks') }}</div>
            <div class="intel-value">{{ modpacks.length }}</div>
            <div class="intel-hint">{{ t('intel_modpacks_hint') }}</div>
          </div>
          <div class="intel-card">
            <div class="intel-label">{{ t('intel_source') }}</div>
            <div class="intel-value" style="font-size:15px">{{ currentSourceName }}</div>
            <div class="intel-hint">{{ t('intel_source_hint') }}</div>
          </div>
        </div>

        <!-- ===== 功能分区切换 ===== -->
        <div class="section-tabs">
          <button class="section-tab" :class="{ active: homeSection === 'mods' }" @click="switchHomeSection('mods')">{{ t('home_mods_title') }}</button>
          <button class="section-tab" :class="{ active: homeSection === 'workshop' }" @click="switchHomeSection('workshop')">{{ t('workshop_tool') }}</button>
          <button class="section-tab" :class="{ active: homeSection === 'modpacks' }" @click="switchHomeSection('modpacks')">{{ t('modpacks') }}</button>
          <button class="section-tab" :class="{ active: homeSection === 'player_modpacks' }" @click="switchHomeSection('player_modpacks')">{{ t('player_modpacks') }}</button>
          <button class="section-tab" :class="{ active: homeSection === 'user_mods' }" @click="switchHomeSection('user_mods')">{{ t('user_mods') }}</button>
          <button class="section-tab" :class="{ active: homeSection === 'ai' }" @click="switchHomeSection('ai')">{{ t('ai_recommend') }}</button>
          <button class="section-tab" :class="{ active: homeSection === 'forum' }" @click="switchHomeSection('forum')">{{ t('forum') }}</button>
          <button class="section-tab" :class="{ active: homeSection === 'installed' }" @click="switchHomeSection('installed')">{{ t('installed_mods') }}</button>
        </div>

        <!-- ===== 车间工具（独立分区）===== -->
      <div class="home-section-body" v-show="homeSection === 'workshop'">
        <div class="workshop-panel">
          <div class="workshop-head">
            <div class="workshop-icon">🛠️</div>
            <div>
              <h2 class="workshop-title">{{ t('workshop_title') }}</h2>
              <p class="workshop-sub">{{ t('workshop_desc') }}</p>
            </div>
          </div>

          <div class="workshop-feats">
            <div class="workshop-feat">📁 {{ t('workshop_feat1') }}</div>
            <div class="workshop-feat">🔍 {{ t('workshop_feat2') }}</div>
            <div class="workshop-feat">🎮 {{ t('workshop_feat3') }}</div>
          </div>

          <div class="workshop-steam" v-if="steamStatus !== null">
            <span v-if="steamStatus.installed">✅ {{ t('steam_found', {path: steamStatus.path}) }}</span>
            <span v-else>⚠️ {{ t('steam_not_found') }}</span>
          </div>

          <div class="workshop-actions">
            <button class="action-btn primary" @click="downloadWorkshopTool">📥 {{ t('workshop_download') }}</button>
            <button class="action-btn secondary" @click="checkSteam">🔍 {{ t('steam_check') }}</button>
          </div>

          <div class="workshop-where">
            <div class="workshop-where-title">📂 {{ t('workshop_where_title') }}</div>
            <ol class="workshop-steps">
              <li>{{ t('workshop_step1') }}</li>
              <li>{{ t('workshop_step2') }}</li>
              <li>{{ t('workshop_step3') }}</li>
              <li>{{ t('workshop_step4') }}</li>
            </ol>
            <div class="workshop-hint">{{ t('workshop_mods_hint') }}</div>
          </div>

          <p class="workshop-tip">{{ t('workshop_tip') }}</p>
        </div>
      </div>

        <!-- ===== 玩家上传模组 ===== -->
      <div class="home-section-body" v-show="homeSection === 'user_mods'">
        <div class="top-bar">
          <h2>{{ t('user_mods') }}</h2>
        </div>
        <div class="filters">
          <button class="action-btn primary" @click="showUploadModModal = true" :disabled="!currentUser">{{ t('upload_mod') }}</button>
          <button class="action-btn secondary" @click="loadUserMods()">{{ t('refresh') }}</button>
        </div>
        <div class="info" v-if="!currentUser" style="margin-bottom:14px;">{{ t('user_mods_login_hint') }}</div>
        <div v-if="userModsLoading" class="loading">{{ t('loading') }}</div>
        <div v-else-if="userMods.length === 0" class="info">{{ t('no_user_mods') }}</div>
        <div v-else class="mod-grid">
          <div class="mod-card" v-for="m in userMods" :key="m.id">
            <div class="mod-image">
              <img :src="m.PictureLink || ''" :alt="m.Name" loading="lazy" @error="imgFallback">
            </div>
            <div class="mod-info">
              <h3>{{ m.Name }}</h3>
              <div class="author" v-if="m.author">{{ t('author') }}{{ m.author }}</div>
              <div class="version">{{ t('version') }}{{ m.Version }}</div>
              <div class="desc">{{ m.description }}</div>
              <div class="mod-actions">
                <a class="btn-install" v-if="m.file_name" :href="'/api/user-mod-file/' + m.file_name" target="_blank" rel="noopener">{{ t('download') }}</a>
                <a class="btn-install" v-else-if="m.DownloadLink" :href="m.DownloadLink" target="_blank" rel="noopener">{{ t('download') }}</a>
              </div>
            </div>
          </div>
        </div>
      </div>

        <!-- ===== 以下为整合进来的功能区 ===== -->

      <div class="home-section-body" v-show="homeSection === 'mods'">
        <div class="top-bar">
          <div class="source-selector">
            <label>{{ t('data_source') }}</label>
            <select v-model.number="sourceIndex" @change="loadMods()">
              <option v-for="(s, i) in sources" :key="i" :value="i">{{ s.name }}</option>
            </select>
            <label><input type="checkbox" v-model="strictMode" @change="loadMods()"> {{ t('strict_mode') }}</label>
          </div>
          <div class="view-toggle">
            <button class="view-btn" :class="{ active: viewMode === 'grid' }" @click="viewMode = 'grid'">{{ t('grid_view') }}</button>
            <button class="view-btn" :class="{ active: viewMode === 'list' }" @click="viewMode = 'list'">{{ t('list_view') }}</button>
          </div>
        </div>
        <div class="filters">
          <input class="search-input" v-model="searchQuery" :placeholder="t('search_placeholder')">
          <select class="category-select" v-model="selectedCategory">
            <option value="">{{ t('all_categories') }}</option>
            <option v-for="cat in categories" :key="cat" :value="cat">{{ cat }}</option>
          </select>
          <button class="action-btn secondary" @click="selectAll('browse')">{{ t('select_all') }}</button>
          <button class="action-btn secondary" @click="invertSelection('browse')">{{ t('invert_selection') }}</button>
          <button class="action-btn secondary" @click="clearSelection('browse')">{{ t('clear_selection') }}</button>
        </div>
        <div v-if="loading" class="loading">{{ t('loading') }}</div>
        <div v-else-if="filteredMods.length === 0" class="info">{{ t('no_mods_found') }}</div>
        <div v-else :class="viewMode === 'grid' ? 'mod-grid' : 'mod-list'">
          <div v-for="mod in filteredMods" :key="mod.FileName" class="mod-card-wrapper">
            <input type="checkbox" class="multi-check" :value="mod.FileName" v-model="selectedBrowse">
            <div class="mod-card" :class="{ 'has-conflict': hasConflict(mod.Name) }" @click="openDetail(mod)">
              <div class="mod-image">
                <img :src="mod.PictureLink || ''" :alt="mod.Name" loading="lazy" @error="imgFallback">
              </div>
              <div class="mod-info">
                <h3>{{ mod.Name }}</h3>
                <div class="author">{{ t('author') }}{{ mod.Author }}</div>
                <div class="version">{{ t('version') }}{{ mod.Version }}</div>
                <div>
                  <span v-if="mod.is_installed" class="mod-tag installed-tag">{{ t('installed') }}</span>
                  <span v-if="mod.Dependency" class="mod-tag dep">{{ t('dep_tag') }}</span>
                  <span v-if="hasConflict(mod.Name)" class="mod-tag conflict">{{ t('conflict_tag') }}</span>
                </div>
                <div class="desc">{{ mod.Description }}</div>
                <div class="mod-actions" @click.stop>
                  <button v-if="!mod.is_installed" class="btn-install" @click="doDownload(mod)" :disabled="mod._busy">{{ mod._busy ? '...' : t('download') }}</button>
                  <button v-else class="btn-uninstall" @click="doUninstall(mod)">{{ t('uninstall') }}</button>
                </div>
              </div>

        </div>
            </div>
          </div>
        </div>
      </div>

      <div class="home-section-body" v-show="homeSection === 'modpacks'">
        <div class="top-bar">
          <div class="source-selector">
            <label>{{ t('data_source') }}</label>
            <select v-model.number="modpackSourceIndex" @change="loadModpacks()">
              <option v-for="(s, i) in sources" :key="i" :value="i">{{ s.name }}</option>
            </select>
          </div>
          <div class="view-toggle">
            <button class="view-btn" :class="{ active: modpackViewMode === 'grid' }" @click="modpackViewMode = 'grid'">{{ t('grid_view') }}</button>

<script>
function initVueApp() {
  var FD = JSON.parse(document.getElementById('flask-data').textContent);

  Vue.createApp({
    data: function() {
      return {
        appReady: true,
        version: FD.version,
        translations: FD.translations || {},
        zhFallback: FD.zhFallback || {},
        activeTab: 'home',
        sidebarCollapsed: false,
        mobileMenuOpen: false,

        // ===== 首页 =====
        homeSection: 'mods',
        homeSearchQuery: '',
        homeSearchType: 'mods',
        homeModScope: 'all',
        homeCategory: '',
        homeViewMode: 'grid',
        homeSelected: [],
        hasAnnouncement: false,
        announcementBadge: '',

        // 游戏情报：玩家可自定义发布
        customIntel: [],
        showIntelEditor: false,
        intelForm: { title: '', content: '', link: '' },

        // ===== 玩家上传模组 =====
        userMods: [],
        userModsLoading: false,
        showUploadModModal: false,
        userModUploading: false,
        userModForm: { name: '', author: '', version: '1.0', category: '',
                       description: '', download_link: '', picture_url: '' },

        sources: [],
        sourceIndex: 0,
        modpackSourceIndex: 0,
        manageSourceIndex: 0,
        strictMode: false,

        mods: [],
        modpacks: [],
        loading: false,
        modpacksLoading: false,

        searchQuery: '',
        debouncedSearch: '',
        selectedCategory: '',
        viewMode: 'grid',
        modpackViewMode: 'grid',
        manageViewMode: 'list',

        selectedBrowse: [],
        selectedManage: [],
        batchBusy: false,

        showDetailModal: false,
        detailMod: null,
        detailDepInfo: [],
        detailConflicts: [],
        detailFetchAbort: null,
        translatingDesc: false,
        translatedDesc: '',
        translatedName: '',

        showResultModal: false,
        resultLines: [],

        installedConflicts: [],
        conflictModNames: {},

        downloadTasks: [],
        dlExpanded: false,
        taskTimer: null,

        config: { exe_path: '', use_proxy: false, backup_name: 'ModpackManager_old.exe' },
        themeBgColor: '#12121a',
        steamStatus: null,
        currentLang: 'auto',
        checkingUpdate: false,
        licenseText: '',
        toasts: [],
        toastId: 0,
        showBackToTop: false,

        // 用户相关
        currentUser: null,
        showLoginModal: false,
        showRegisterModal: false,
        loginForm: { username: '', password: '' },
        registerForm: { username: '', password: '', confirmPassword: '' },
        loginLoading: false,
        registerLoading: false,

        // 玩家整合包相关
        playerModpacks: [],
        playerModpacksLoading: false,
        playerModpackViewMode: 'grid',
        showUploadModal: false,
        uploadForm: { name: '', author: '', description: '', picture_url: '', video_url: '', tutorial_url: '' },
        uploadFile: null,
        uploadPicture: null,
        uploadVideo: null,
        uploadLoading: false,

        // 论坛相关
        forumPosts: [],
        forumLoading: false,
        forumModpackFilter: '',
        showPostModal: false,
        postForm: { modpack_id: '', content: '', image_url: '', video_url: '' },
        postLoading: false,
        postImage: null,
        postVideo: null,
        showCommentsModal: false,
        currentPost: null,
        postComments: [],
        newComment: '',

        // 公告相关
        showAnnouncementModal: false,
        currentAnnouncement: null,
        announcementCountdown: 10,
        announcementTimer: null,

        // AI推荐相关
        aiSearchQuery: '',
        aiRecommendations: [],
        aiLoading: false,
        aiError: '',
        aiConfig: {
          ai: {
            name: 'AI模组推荐助手',
            intro: '大家好！我是AI模组推荐助手，专为长途旅行(The Long Drive)游戏玩家设计。我可以根据您的需求推荐最适合的模组，帮助您提升游戏体验！',
            features: ['智能推荐', '模组搜索', '热门排行', '一键下载']
          }
        },
        aiQuickTags: ['细菌', '车辆', '地图', '食物', '武器', '牛奶', '优化', '生存'],
        appBlockedByAnnouncement: false
      };
    },

    computed: {
      categories: function() { var s={}; this.mods.forEach(function(m){if(m.Category)s[m.Category]=1}); return Object.keys(s).sort(); },
      filteredMods: function() {
        var self=this, r=this.mods;
        if(this.debouncedSearch){var q=this.debouncedSearch.toLowerCase();r=r.filter(function(m){return(m.Name&&m.Name.toLowerCase().indexOf(q)!==-1)||(m.Author&&m.Author.toLowerCase().indexOf(q)!==-1)||(m.Description&&m.Description.toLowerCase().indexOf(q)!==-1)})}
        if(this.selectedCategory){r=r.filter(function(m){return m.Category===self.selectedCategory})}
        return r;
      },
      installedMods: function() { return this.mods.filter(function(m){return m.is_installed}); },
      batchBarActive: function() { if(this.activeTab==='browse')return this.selectedBrowse.length>0; if(this.activeTab==='manage')return this.selectedManage.length>0; return false; },
      batchCount: function() { if(this.activeTab==='browse')return this.selectedBrowse.length; if(this.activeTab==='manage')return this.selectedManage.length; return 0; },
      activeTaskCount: function() { return this.downloadTasks.filter(function(t){return t.status==='downloading'||t.status==='pending'}).length; },
      // 当前数据源名称（游戏情报卡片用）
      currentSourceName: function() {
        var s = this.sources[this.sourceIndex];
        if (!s) return '-';
        return s.Title || s.title || s.name || ('Source ' + (this.sourceIndex + 1));
      },
      // 首页模组列表：整合了「浏览模组」+「已安装模组」
      homeFilteredMods: function() {
        var r = this.mods;
        if (this.homeModScope === 'installed') {
          r = r.filter(function(m) { return m.is_installed; });
        }
        var q = (this.homeSearchQuery || '').trim().toLowerCase();
        if (q) {
          r = r.filter(function(m) {
            return (m.Name && m.Name.toLowerCase().indexOf(q) !== -1) ||
              (m.Author && m.Author.toLowerCase().indexOf(q) !== -1) ||
              (m.Description && m.Description.toLowerCase().indexOf(q) !== -1);
          });
        }
        if (this.homeCategory) {
          r = r.filter(function(m) { return m.Category === this.homeCategory; }.bind(this));
        }
        return r;
      }
    },

    watch: {
      searchQuery: function(val) {
        var self = this;
        clearTimeout(this._searchTimer);
        this._searchTimer = setTimeout(function() { self.debouncedSearch = val; }, 300);
      }
    },

    methods: {
      t: function(key, args) {
        // 文案查找顺序：当前语言 → 中文兜底 → 键名
        // （非中文语言包未覆盖的键直接显示中文，不显示 [key]）
        var cur = this.translations[key];
        if (!cur || (typeof cur === 'string' && cur.charAt(0) === '[' && cur.charAt(cur.length - 1) === ']')) {
          cur = this.zhFallback && this.zhFallback[key] ? this.zhFallback[key] : key;
        }
        var text = cur;
        if(args){Object.keys(args).forEach(function(k){text=text.replace('{'+k+'}',String(args[k]))})}
        return text;
      },

      initLanguage: function() {
        var saved=localStorage.getItem('tld_lang')||'auto'; this.currentLang=saved;
        var lang=saved;
        if(lang==='auto'){var nl=navigator.language||'';lang=nl.startsWith('zh')?'zh':nl.startsWith('fr')?'fr':nl.startsWith('ar')?'ar':nl.startsWith('es')?'es':nl.startsWith('ru')?'ru':'en'}
        // 中文兜底文案先备好，其他语言缺失时回退显示中文
        if(lang!=='zh'){
          var self0=this;

      // ===== 详情（#1 用正确数据源，#2 AbortController） =====
      // ===== 自动翻译：打开详情时把名/简介翻成「当前界面语言」 =====
      // 目标语言跟随界面：界面是中文就翻中文，是英文就翻英文，以此类推。
      // 若界面语言不在工具支持的翻译语种之列，则回退到英文（用户要求）。
      translateTargetLang: function() {
        var map = { zh: 'zh', en: 'en', fr: 'fr', es: 'es', ru: 'ru', ar: 'ar' };
        var lang = this.currentLang;
        if (lang && lang !== 'auto' && map[lang]) return lang;
        // auto：按浏览器语言判定；判定不出来或不支持 → en
        var nl = (navigator.language || '').toLowerCase();
        if (nl.indexOf('zh') === 0) return 'zh';
        if (nl.indexOf('fr') === 0) return 'fr';
        if (nl.indexOf('es') === 0) return 'es';
        if (nl.indexOf('ru') === 0) return 'ru';
        if (nl.indexOf('ar') === 0) return 'ar';
        if (nl.indexOf('en') === 0) return 'en';
        return 'en';
      },

      // 译文里是否含目标语言的代表性字符
      _looksTranslated: function(s, target) {
        if (!s) return false;
        switch (target) {
          case 'zh': return /[\u4e00-\u9fa5]/.test(s);
          case 'ru': return /[\u0400-\u04ff]/.test(s);
          case 'ar': return /[\u0600-\u06ff]/.test(s);
          default:   return /[A-Za-z]/.test(s);   // en / fr / es 暂按拉丁字母判断
        }
      },

      autoTranslateDetail: function(mod) {
        if (!mod) return;
        var self = this;
        var name = (mod.Name || '').trim();
        var desc = (mod.Description || '').trim();
        var target = this.translateTargetLang();
        // 该语种下原文已是用目标语言写的，就不用翻了
        var alreadyTarget = function(s) { return self._looksTranslated(s, target); };

        // 带一次重试：公共翻译接口偶发失败，重试一次大多能成功
        function request(text, onDone) {
          var tried = 0;
          function attempt() {
            fetch('/api/translate', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ text: text, target: target })
            })
            .then(function(r) { return r.json(); })
            .then(function(d) {
              var out = (d && d.success && d.translated) ? d.translated : '';
              // 必须确实被翻译了（结果含目标语言字符）才回填，避免显示原文
              if (out && out !== text && self._looksTranslated(out, target)) {
                onDone(out);
              } else if (++tried < 2) {
                attempt();
              }
              // 重试仍失败 → 静默放弃，保留原文
            })
            .catch(function() {
              if (++tried < 2) attempt();
            });
          }
          attempt();
        }

        if (name && !alreadyTarget(name)) {
          request(name, function(t) { self.translatedName = t; });
        }
        if (desc && !alreadyTarget(desc)) {
          var shortDesc = desc.length > 400 ? desc.slice(0, 400) : desc;
          request(shortDesc, function(t) { self.translatedDesc = t; });
        }
      },

      openDetail: function(mod) {
        var self = this;
        if (this.detailFetchAbort) {
          try { this.detailFetchAbort.abort(); } catch(e) {}
        }
        this.detailFetchAbort = new AbortController();
        var signal = this.detailFetchAbort.signal;

        this.detailMod = mod;
        this.detailDepInfo = [];
        this.detailConflicts = [];
        this.translatedName = '';
        this.translatedDesc = '';
        this.showDetailModal = true;

        // 自动翻译：打开详情即把英文名/简介翻成中文（失败静默，保留原文）
        this.autoTranslateDetail(mod);

        var src = this.activeTab === 'manage' ? this.manageSourceIndex : this.sourceIndex;

        if (mod.FileName) {
          fetch('/api/resolve-deps', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({filename: mod.FileName, source: src}),
            signal: signal

          .then(function(d) { self.detailDepInfo = d.dependencies || []; })
          .catch(function(e) { if (e.name !== 'AbortError') {} });
        }
        if (mod.Name) {
          fetch('/api/check-new-conflicts', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: mod.Name}),
            signal: signal
          })
          .then(function(r) { return r.json(); })
          .then(function(d) { self.detailConflicts = d.conflicts || []; })
          .catch(function(e) { if (e.name !== 'AbortError') {} });
        }
      },

          .then(function(r) { return r.json(); })
          .then(function(d) {
            if (d.success && d.has_unread) {
              self.currentAnnouncement = d.announcement;
              self.showAnnouncementModal = true;
              self.appBlockedByAnnouncement = true;
              self.startAnnouncementCountdown();

      startAnnouncementCountdown: function(seconds) {
        var self = this;
        this.announcementCountdown = (typeof seconds === 'number' && seconds > 0) ? seconds : 10;
        
        if (this.announcementTimer) {
          clearInterval(this.announcementTimer);
        }
        
        this.announcementTimer = setInterval(function() {
          self.announcementCountdown--;
          if (self.announcementCountdown <= 0) {
            clearInterval(self.announcementTimer);
            self.announcementTimer = null;
          }
        }, 1000);
      },

      markAnnouncementRead: function() {
        var self = this;

        // 倒计时未结束时不响应
        if (this.announcementCountdown > 0) return;

        // 先关闭弹窗（无论后端是否成功），避免 default公告 / 未登录场景下弹窗关不掉
        this.showAnnouncementModal = false;
        this.appBlockedByAnnouncement = false;
        this.currentAnnouncement = null;
        if (this.announcementTimer) {
          clearInterval(this.announcementTimer);
          this.announcementTimer = null;
        }

        // 默认公告（无 id）或未登录时，无需再请求后端标记已读
        var ann = this.currentAnnouncement;
        var uid = this.currentUser ? this.currentUser.id : null;
        if (!ann || !ann.id || !uid) return;

        fetch('/api/announcement/read', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            announcement_id: ann.id,
            user_id: uid
          })
        })
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (d.success) {
            self.showToast(self.t('announcement_read_success'), 'success');
          } else {
            self.showToast(d.error || self.t('announcement_read_failed'), 'error');
          }
        })

      try {
        var savedIntel = JSON.parse(localStorage.getItem('tld_custom_intel') || '[]');
        if (Array.isArray(savedIntel)) this.customIntel = savedIntel;
      } catch(e) {}
      // 启动时展示每日公告（带5 秒倒计时，未读完无法关闭）
      var self = this;
      setTimeout(function() {
        self.showAnnouncementModal = true;
        self.startAnnouncementCountdown(5);
        fetch('/api/announcements')
          .then(function(r) { return r.json(); })
          .then(function(d) {
            var list = (d && (d.announcements || d.data)) || [];
            if (list && list.length) self.currentAnnouncement = list[0];
          })
          .catch(function(){});
      }, 600);
      // 如果用户已登录，检查未读公告
      if (this.currentUser) {
        this.checkUnreadAnnouncement();
      }
    },
    beforeUnmount: function() { this.stopPolling(); if(this.announcementTimer) clearInterval(this.announcementTimer); }
  }).mount('#app');
}
</script>
